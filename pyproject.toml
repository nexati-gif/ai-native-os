# pyproject.toml for AI-Native OS Orchestrator
# Used by commitizen, pre-commit, and other Python tools

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-os"
version = "0.1.0"
description = "AI-Native Operating System Orchestrator"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit",
    "commitizen",
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "markdownlint",
    "yamllint",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
changelog_filename = "CHANGELOG.md"
update_changelog_on_bump = true
major_version_zero = true

[tool.commitizen.message]
template = """{{change_type}}({{scope}}): {{message}}

{{body}}

{{footer}}"""
questions = [
    {"type": "list", "name": "change_type", "message": "Select the type of change:", "choices": [
        {"name": "feat: A new feature", "value": "feat"},
        {"name": "fix: A bug fix", "value": "fix"},
        {"name": "docs: Documentation only changes", "value": "docs"},
        {"name": "style: Changes that do not affect the meaning of the code", "value": "style"},
        {"name": "refactor: A code change that neither fixes a bug nor adds a feature", "value": "refactor"},
        {"name": "perf: A code change that improves performance", "value": "perf"},
        {"name": "test: Adding missing tests or correcting existing tests", "value": "test"},
        {"name": "build: Changes that affect the build system or external dependencies", "value": "build"},
        {"name": "ci: Changes to our CI configuration files and scripts", "value": "ci"},
        {"name": "chore: Other changes that don't modify src or test files", "value": "chore"},
        {"name": "revert: Reverts a previous commit", "value": "revert"}
    ]},
    {"type": "input", "name": "scope", "message": "Denote the SCOPE of this change (optional):"},
    {"type": "input", "name": "subject", "message": "Write a SHORT, IMPERATIVE tense description of the change:"},
    {"type": "input", "name": "body", "message": "Provide a LONGER description of the change (optional):"},
    {"type": "confirm", "name": "is_breaking", "message": "Are there any BREAKING CHANGES?"},
    {"type": "input", "name": "footer", "message": "Footer. Information about Breaking Changes and reference issues (optional):"}
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.markdownlint]
default = true
MD013 = false  # Line length
MD024 = false  # Multiple headers with same content
MD033 = false  # Inline HTML
MD041 = false  # First line should be top-level header

[tool.yamllint]
extends: default
rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
  truthy:
    allowed-values: ["true", "false", "yes", "no"]