[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/orchestrator-core",
    "crates/orchestrator-observe",
    "crates/orchestrator-plan",
    "crates/orchestrator-act",
    "crates/orchestrator-validate",
    "crates/orchestrator-federate",
    "crates/orchestrator-ui",
    "crates/orchestrator-policy",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/your-org/ai-native-os"
description = "AI-Native Operating System Orchestrator"
authors = ["Your Name <your@email.com>"]

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full", "tracing"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
config = "0.14"
async-trait = "0.1"
futures = "0.3"
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.5"

# CLI / Config
clap = { version = "4.5", features = ["derive", "env", "yaml"] }

# Embedded DB
redb = "0.23"

# eBPF
aya = { version = "0.12", features = ["async"] }
aya-log = "0.12"
aya-obj = "0.12"

# Nix
nix = "0.5"

# Sandbox / Virtualization
tokio-process = "0.2"
command-group = "0.4"

# HTTP / Web UI
axum = { version = "0.7", features = ["ws", "json", "form"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
hyper = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Inference (candle)
candle-core = { version = "0.6", features = ["cuda", "metal", "mkl"] }
candle-nn = { version = "0.6", features = ["cuda", "metal", "mkl"] }
candle-transformers = { version = "0.6", features = ["cuda", "metal", "mkl"] }
tokenizers = "0.15"
hf-hub = { version = "0.3", features = ["reqwest"] }

# Vector DB / RAG
qdrant-client = { version = "1.8", features = ["grpc"] }

# Federation
tailscale = { version = "0.1", git = "https://github.com/tailscale/tailscale-go" }
automerge = { version = "0.3", features = ["serde"] }
git2 = "0.18"

# Policy
opa-wasm = "0.3"

# Metrics / Validation
statrs = "0.16"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }

# Testing
tempfile = "3.8"
predicates = "3.0"

# Serialization
serde_yaml = "0.9"
html_escape = "0.2"
bincode = "1.3"

# Random
rand = { version = "0.8", features = ["small_rng"] }

# System info
hostname = "0.3"

[profile.dev]
opt-level = 1
debug = true
split-debuginfo = "packed"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.ci]
inherits = "release"
debug = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["systemd", "net", "process", "user"] }