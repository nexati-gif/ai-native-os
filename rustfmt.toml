# Rustfmt configuration for AI-Native OS Orchestrator

# General style
edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
use_small_heuristics = "Max"

# Import organization
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
imports_layout = "Vertical"
reorder_imports = true

# Formatting
brace_style = "SameLineWhere"
control_brace_style = "SameLineWhere"
fn_brace_style = "SameLineWhere"
struct_lit_style = "Vertical"
enum_discriminant_align_threshold = 0
wrap_comments = true
normalize_comments = true
format_code_in_doc_comments = true
format_strings = true

# Spacing
spaces_around_ranges = true
spaces_around_brackets = true
spaces_within_parens = false
spaces_within_brackets = false
spaces_within_braces = true
spaces_around_operators = true
spaces_around_colons = true

# Line endings
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1
blank_lines_between_items = 1

# Attributes
attr_fn_like = "Vertical"
condense_wildcard_suffixes = true
merge_derives = true
merge_imports = true

# Macros
force_explicit_abi = false
empty_item_single_line = true
fn_single_line = false
struct_field_align_threshold = 0
struct_variant_width_threshold = 0
array_width_threshold = 0
chain_width_threshold = 60
single_line_if_else_max_width = 50

# Where clauses
where_single_line = false
where_predicate_single_line = false

# Match arms
match_block_trailing_comma = true
match_arm_leading_pipes = "Never"

# Use field init shorthand
use_field_init_shorthand = true
use_try_shorthand = true