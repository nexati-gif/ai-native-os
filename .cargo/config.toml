# Cargo configuration for AI-Native OS Orchestrator

[build]
# Use target directory in project root
target-dir = "target"
# Number of parallel jobs (0 = auto)
jobs = 0
# Show timings
timings = true

[build.release]
# Strip symbols in release builds
strip = "debuginfo"
# LTO
lto = "thin"
# Codegen units
codegen-units = 1
# Panic strategy
panic = "abort"

[profile.ci]
inherits = "release"
debug = true

[profile.bench]
inherits = "release"
debug = true

[target.x86_64-unknown-linux-gnu]
# Linker for faster linking
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "target-cpu=native",
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

# Environment variables for build scripts
[env]
# BPF compilation
CLANG = "clang-17"
BPFTOOL = "bpftool"
# For cross-compilation
CC_x86_64_unknown_linux_gnu = "clang"
CXX_x86_64_unknown_linux_gnu = "clang++"
AR_x86_64_unknown_linux_gnu = "llvm-ar"

# Disable incremental compilation for CI
CARGO_INCREMENTAL = "0"

# Rust analyzer settings
[rust-analyzer]
checkOnSave = true
check = { command = "clippy", allTargets = true }
diagnostics = { enable = true, disabled = ["unresolved-proc-macro"] }
inlayHints = { typeHints = true, parameterHints = true, chainingHints = true }
cargo = { target = "x86_64-unknown-linux-gnu", allFeatures = true }