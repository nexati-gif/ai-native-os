name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: stable

jobs:
  # ---------- Rust Checks ----------
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install minimal system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libclang-dev \
            libbpf-dev \
            linux-headers-$(uname -r) \
            pkg-config \
            libssl-dev \
            libgit2-dev \
            protobuf-compiler \
            cmake \
            libelf-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings 2>&1 | head -100

      - name: Build workspace
        run: cargo build --workspace --locked 2>&1 | tail -50

      - name: Run unit tests
        run: cargo test --workspace --locked --lib 2>&1 | tail -50

      - name: Security audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Nix Checks ----------
  nix-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ hashFiles('**/flake.nix', '**/flake.lock') }}
          restore-keys: nix-store-

      - name: Flake check
        run: nix flake check --no-build 2>&1 | tail -50

      - name: Build orchestrator package
        run: nix build .#orchestrator --no-link 2>&1 | tail -30

      - name: Check NixOS configs
        run: |
          nix-instantiate --eval --strict nix/hosts/laptop.nix >/dev/null
          nix-instantiate --eval --strict nix/hosts/phone.nix >/dev/null

  # ---------- eBPF Compilation ----------
  ebpf-build:
    name: eBPF Programs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            bpftool

      - name: Build eBPF programs
        run: |
          cd crates/orchestrator-observe
          cargo build --locked 2>&1 | grep -E "(Compiling|Finished|error)" || true

  # ---------- Container Image ----------
  container:
    name: Container Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        run: |
          docker build -t ai-native-os/orchestrator:latest -f Dockerfile . 2>&1 | tail -50

  # ---------- Documentation ----------
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          ignore-urls: "http://localhost:*,https://github.com/*,git@github.com:*"

      - name: Check README exists
        run: test -f README.md

  # ---------- Release ----------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [rust-check, nix-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --workspace --locked

      - name: Create release archive
        run: |
          mkdir -p release
          cp target/release/orchestrator release/
          tar -czf orchestrator-${{ github.ref_name }}.tar.gz -C release .

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: orchestrator-${{ github.ref_name }}.tar.gz
          generate_release_notes: true